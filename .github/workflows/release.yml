name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Build and verify only; skip publishing to the Marketplace'
        type: boolean
        default: false

jobs:
  release:
    name: Publish to VS Code Marketplace
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Use Node.js 22.x
        uses: actions/setup-node@v4
        with:
          node-version: 22.x
          cache: 'npm'

      - run: npm ci

      # A tag that disagrees with package.json would publish the wrong version,
      # or fail late after a full build, so fail fast.
      - name: Verify tag matches package.json version
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          VERSION=$(node -p "require('./package.json').version")
          TAG="${GITHUB_REF_NAME#v}"
          echo "tag=${TAG} package.json=${VERSION}"
          if [ "${TAG}" != "${VERSION}" ]; then
            echo "::error::Tag ${GITHUB_REF_NAME} does not match package.json version ${VERSION}. Bump the version or fix the tag."
            exit 1
          fi

      - run: npm run lint
      - run: npm test
      - run: npm run build

      - name: Package extension
        run: npm run package

      - name: Select the packaged VSIX
        id: vsix
        run: |
          # *.vsix is gitignored, so exactly one should exist here. Fail loudly
          # rather than guessing if that assumption ever breaks.
          mapfile -t files < <(ls -1 ./*.vsix 2>/dev/null || true)
          if [ "${#files[@]}" -ne 1 ]; then
            echo "::error::Expected exactly one .vsix, found ${#files[@]}: ${files[*]}"
            exit 1
          fi
          echo "path=${files[0]}" >> "$GITHUB_OUTPUT"
          echo "Selected ${files[0]}"

      - name: Upload VSIX artifact
        uses: actions/upload-artifact@v4
        with:
          name: extension-vsix
          path: ${{ steps.vsix.outputs.path }}

      - name: Publish to VS Code Marketplace
        if: github.event_name == 'push' || inputs.dry_run == false
        env:
          VSCE_PAT: ${{ secrets.VSCE_PAT }}
        run: |
          # --skip-duplicate makes re-runs and repeated tag pushes succeed
          # natively; a bad or expired PAT still fails the build.
          npx vsce publish --no-dependencies --skip-duplicate \
            --packagePath "${{ steps.vsix.outputs.path }}"
